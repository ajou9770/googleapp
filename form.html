<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구글 시트 데이터 입력</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            padding: 20px;
        }
        .container {
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>데이터 입력 폼</h1>
        <form id="dataForm">
            <div class="form-group">
                <label for="name">성명</label>
                <input type="text" class="form-control" id="name" required>
            </div>
            <div class="form-group">
                <label for="id">아이디</label>
                <input type="text" class="form-control" id="id" required>
            </div>
            <div class="form-group">
                <label for="email">이메일</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="form-group">
                <label for="contact">연락처</label>
                <input type="text" class="form-control" id="contact" required>
            </div>
            <div class="form-group">
                <label for="signature">서명</label>
                <input type="text" class="form-control" id="signature" required>
            </div>
            <div class="form-group">
                <label for="message">기타 남기실 말씀</label>
                <textarea class="form-control" id="message" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">제출</button>
        </form>
        <div id="response" class="mt-3"></div>
    </div>

    <script>
        document.getElementById('dataForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            var formData = {
                name: document.getElementById('name').value,
                id: document.getElementById('id').value,
                email: document.getElementById('email').value,
                contact: document.getElementById('contact').value,
                signature: document.getElementById('signature').value,
                message: document.getElementById('message').value
            };
            
            fetch('https://script.google.com/macros/s/AKfycbyhCdlFWwsdo0m2kiWDPfn8vy0r8Eumy2baDSGWwhmF9WemDZlSwEtqbDb28XwSTQyZ/exec', { // 여기에 실제 Google Apps Script URL을 입력하세요.
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('response').innerHTML = '<div class="alert alert-success">데이터가 성공적으로 저장되었습니다!</div>';
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('response').innerHTML = '<div class="alert alert-danger">데이터 저장에 실패했습니다.</div>';
            });
        });
    </script>
</body>
</html>
