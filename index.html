<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form</title>
    <!-- Bootstrap CSS CDN 링크 -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 추가적인 사용자 정의 스타일 */
        .container {
            max-width: 600px;
            margin-top: 20px;
        }
        .loading {
            position: relative;
            padding-right: 40px; /* Ensure space for the spinner */
        }
        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #007bff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            position: absolute;
            top: 50%;
            right: 10px;
            margin-top: -8px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h3 class="text-center mb-4">신청하기</h3>
        <form id="application-form">
            <div class="form-group">
                <input
                    type="number"
                    id="id"
                    name="id"
                    class="form-control"
                    placeholder="✨사번을 입력하세요(숫자만)"
                    required>
            </div>
            <div class="form-group">
                <input
                    type="text"
                    id="name"
                    name="name"
                    class="form-control"
                    placeholder="🤵이름을 입력하세요"
                    required>
            </div>
            <div class="form-group">
                <input
                    type="tel"
                    id="tel"
                    name="tel"
                    class="form-control"
                    placeholder="☎연락처(숫자) 입력"
                    required>
            </div>
            <div class="form-group">
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="📧이메일 입력"
                    required>
            </div>
            <div class="form-group">
                <label for="message">💬남기실 말씀:</label>
                <textarea
                    id="message"
                    name="message"
                    class="form-control"
                    rows="2"></textarea>
            </div>
            <button type="submit" id="submit-button" class="btn btn-primary btn-block loading">
                제출하기
                <div class="spinner d-none"></div> <!-- 로딩 스피너 -->
            </button>
            <div id="response" class="mt-3"></div>
        </form>
    </div>

    <!-- Bootstrap JS 및 jQuery CDN 링크 -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        document.getElementById('application-form').addEventListener('submit', function (event) {
            event.preventDefault();

            var id = document.getElementById('id').value;
            var name = document.getElementById('name').value;
            var tel = document.getElementById('tel').value;
            var email = document.getElementById('email').value;
            var message = document.getElementById('message').value;

            var confirmationMessage = `
                ✔입력하신 내용을 확인해주세요:\n\n
                사번: ${id}\n
                이름: ${name}\n
                연락처: ${tel}\n
                이메일: ${email}\n\n
                이대로 제출하시겠습니까?
            `;

            if (confirm(confirmationMessage)) {
                // 사용자가 '확인'을 클릭했을 때
                var submitButton = document.getElementById('submit-button');
                var spinner = document.querySelector('.spinner');
                submitButton.textContent = '🔄제출중 >>>>';
                submitButton.disabled = true;
                spinner.classList.remove('d-none');

                var formData = {
                    id: id,
                    name: name,
                    tel: tel,
                    email: email,
                    message: message
                };

                alert('🤷‍♂️제출중입니다. 잠시만 기다려주세요');

                fetch('https://script.google.com/macros/s/AKfycbzW44PNYXOu6b49euR77R-PNKS7h6i_D3kGN5H' +
                    'KLEOLiZsWCZOWo3g2D822Zt6pDarw/exec', {
                    method: 'POST',
                    headers: {},
                    body: JSON.stringify(formData)
                })
                .then(response => response.json())
                .then(data => {
                    alert('🚀 정상 제출되었습니다.');
                    document.getElementById('application-form').reset();
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('response').textContent = '⚠서버 저장 시 오류 발생';
                })
                .finally(() => {
                    submitButton.textContent = '제출하기';
                    submitButton.disabled = false;
                    spinner.classList.add('d-none');
                });
            } else {
                // 사용자가 '취소'를 클릭했을 때
                alert('⚠ 제출이 취소되었습니다.');
            }
        });
    </script>
</body>
</html>
